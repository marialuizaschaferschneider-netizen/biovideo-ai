<script>

/* ==================================================
   BIOVIDEO AI V1.7
   ================================================== */


/* ---------- DICIONÁRIO ---------- */

const dicionario = {

"cerebro":"brain",
"cérebro":"brain",
"mente":"mind",

"neuronio":"neuron",
"neurônio":"neuron",
"neuronios":"neurons",
"neurônios":"neurons",

"doenca":"disease",
"doença":"disease",
"doencas":"diseases",
"doenças":"diseases",

"cancer":"cancer",
"câncer":"cancer",

"agricultura":"agriculture",

"plantas":"plants",
"planta":"plant",

"fotossintese":"photosynthesis",
"fotossíntese":"photosynthesis",

"clima":"climate",

"ambiente":"environment",
"ambiental":"environment",

"agua":"water",
"água":"water",

"bacteria":"bacteria",
"bactérias":"bacteria",
"bacterias":"bacteria",

"virus":"virus",
"vírus":"virus",

"vacina":"vaccine",
"vacinas":"vaccines",

"genetica":"genetics",
"genética":"genetics",

"genetico":"genetic",
"genético":"genetic",

"dna":"DNA",
"rna":"RNA",

"biotecnologia":"biotechnology",

"medicina":"medicine",

"saude":"health",
"saúde":"health",

"tecnologia":"technology",

"inteligencia":"intelligence",
"inteligência":"intelligence",

"artificial":"artificial",

"educacao":"education",
"educação":"education",

"psicologia":"psychology",

"comportamento":"behavior",

"memoria":"memory",
"memória":"memory",

"sono":"sleep",

"alimentacao":"nutrition",
"alimentação":"nutrition",

"nutricao":"nutrition",
"nutrição":"nutrition"

};


/* ---------- ESPERA ---------- */

function esperar(ms) {

return new Promise(
resolve => setTimeout(resolve,ms)
);

}


/* ---------- TERMOS ---------- */

function gerarTermosDePesquisa(tema) {

const texto =
tema
.toLowerCase()
.trim();

const palavras =
texto
.replace(/[?!.,;:()]/g,"")
.split(/\s+/);

const traduzidas = [];

palavras.forEach(palavra => {

if(dicionario[palavra]) {

traduzidas.push(
dicionario[palavra]
);

}

});


const termos = [];


/* Busca original */

termos.push(
texto
);


/* Busca em inglês */

if(traduzidas.length > 0) {

termos.push(
traduzidas.join(" AND ")
);

}


/* Busca restrita */

if(traduzidas.length >= 2) {

termos.push(
traduzidas.join(" AND ") +
"[Title/Abstract]"
);

}


return termos;

}


/* ---------- PESQUISA ---------- */

async function pesquisarPubMed(
tema,
profundidade
) {

let limite = 5;

if(profundidade === "completa") {
limite = 10;
}

if(profundidade === "profunda") {
limite = 15;
}


const termos =
gerarTermosDePesquisa(tema);


const ids = [];
const usados = new Set();


for(const termo of termos) {

try {

const url =
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi" +
"?db=pubmed" +
"&term=" +
encodeURIComponent(termo) +
"&retmax=" +
limite +
"&retmode=json" +
"&sort=relevance" +
"&tool=BioVideoAI";


const resposta =
await fetch(url);


if(!resposta.ok) {
continue;
}


const dados =
await resposta.json();


const encontrados =
dados.esearchresult.idlist || [];


encontrados.forEach(id => {

if(!usados.has(id)) {

usados.add(id);
ids.push(id);

}

});


await esperar(300);

}

catch(erro) {

console.log(
"Erro na busca:",
erro
);

}

}


return ids.slice(0,limite);

}


/* ---------- BUSCAR ARTIGOS ---------- */

async function buscarArtigos(ids) {

if(ids.length === 0) {
return [];
}


const url =
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi" +
"?db=pubmed" +
"&id=" +
ids.join(",") +
"&retmode=xml" +
"&tool=BioVideoAI";


const resposta =
await fetch(url);


if(!resposta.ok) {
throw new Error(
"Falha ao recuperar artigos."
);
}


const xml =
await resposta.text();


const documento =
new DOMParser()
.parseFromString(
xml,
"text/xml"
);


const artigosXML =
documento.querySelectorAll(
"PubmedArticle"
);


const artigos = [];


artigosXML.forEach(
artigo => {

const titulo =
artigo.querySelector(
"ArticleTitle"
);


const pmid =
artigo.querySelector(
"PMID"
);


const abstracts =
artigo.querySelectorAll(
"AbstractText"
);


let resumo = "";


abstracts.forEach(
parte => {

resumo +=
parte.textContent +
" ";

});


artigos.push({

titulo:
titulo
? titulo.textContent.trim()
: "Título não disponível",

resumo:
resumo.trim(),

pmid:
pmid
? pmid.textContent
: "",

link:
pmid
? "https://pubmed.ncbi.nlm.nih.gov/" +
pmid.textContent +
"/"
: ""

});

});


return artigos;

}


/* ---------- PALAVRAS PRINCIPAIS ---------- */

function palavrasPrincipais(tema) {

const ignoradas = [

"como",
"para",
"sobre",
"uma",
"umas",
"uns",
"dos",
"das",
"que",
"qual",
"quais",
"isso",
"esta",
"este",
"com",
"sem",
"por",
"uma",
"um",
"e",
"ou",
"de",
"da",
"do",
"em",
"na",
"no"

];


return tema
.toLowerCase()
.replace(/[?!.,;:()]/g,"")
.split(/\s+/)
.filter(
p =>
p.length > 3 &&
!ignoradas.includes(p)
);

}


/* ---------- PONTUAÇÃO DE RELEVÂNCIA ---------- */

function calcularRelevancia(
artigo,
tema
) {

const palavras =
palavrasPrincipais(tema);


const texto =
(
artigo.titulo +
" " +
artigo.resumo
)
.toLowerCase();


let pontos = 0;


palavras.forEach(
palavra => {

if(
texto.includes(
palavra
)
) {

pontos += 2;

}

});


/*
Termos científicos em inglês
também recebem peso.
*/

const traduzidas =
gerarTermosDePesquisa(
tema
);


traduzidas.forEach(
termo => {

const partes =
termo
.replace(
"[Title/Abstract]",
""
)
.split("AND");

partes.forEach(
parte => {

const palavra =
parte
.trim()
.toLowerCase();

if(
palavra.length > 3 &&
texto.includes(palavra)
) {

pontos += 3;

}

});

});


return pontos;

}


/* ---------- ORDENAR ARTIGOS ---------- */

function ordenarPorRelevancia(
artigos,
tema
) {

return artigos
.map(
artigo => ({

...artigo,

relevancia:
calcularRelevancia(
artigo,
tema
)

})
)
.sort(
(a,b) =>
b.relevancia -
a.relevancia
);

}


/* ---------- EVIDÊNCIAS ---------- */

function gerarEvidencias(
artigos
) {

let texto = "";


texto +=
"📚 EVIDÊNCIAS CIENTÍFICAS UTILIZADAS\n\n";


if(artigos.length === 0) {

texto +=
"Nenhum artigo científico foi encontrado.\n";

return texto;

}


artigos.forEach(
(artigo,index) => {

texto +=
"━━━━━━━━━━━━━━━━━━━━\n\n";


texto +=
"📄 ARTIGO " +
(index + 1) +
"\n\n";


texto +=
"📌 TÍTULO\n" +
artigo.titulo +
"\n\n";


texto +=
"🧪 RELEVÂNCIA\n" +
"Pontuação de relevância: " +
artigo.relevancia +
"\n\n";


if(artigo.resumo) {

texto +=
"📖 RESUMO\n" +
artigo.resumo +
"\n\n";

}
else {

texto +=
"📖 RESUMO\n" +
"Resumo não disponível para este artigo.\n\n";

}


if(artigo.pmid) {

texto +=
"PMID: " +
artigo.pmid +
"\n";

}


if(artigo.link) {

texto +=
"🔗 " +
artigo.link +
"\n";

}


texto += "\n";

});


return texto;

}

"🎯 CENA 2 — CONCEITO PRINCIPAL\n\n";

"⏱️ 0:20–0:55\n\n";

"🖼️ VISUAL SUGERIDO\n" +

/* ---------- CRIAR ---------- */

async function criarRascunho() {

const resultado =
document.getElementById(
"resultado"
);

const roteiro =
document.getElementById(
"roteiro"
);

const status =
document.getElementById(
"status"
);


const tema =
document
.getElementById("tema")
.value
.trim();


const duracao =
parseInt(
document
.getElementById("duracao")
.value
);


const tipo =
document
.getElementById("tipo")
.value;


const profundidade =
document
.getElementById("profundidade")
.value;


const narracao =
document
.getElementById("usarNarracao")
.checked;


const legenda =
document
.getElementById("usarLegenda")
.checked;


const musica =
document
.getElementById("usarMusica")
.checked;


const referencias =
document
.getElementById("usarReferencias")
.checked;


if(!tema) {

alert(
"Digite o tema do vídeo primeiro."
);

return;

}


resultado.style.display =
"block";


resultado.scrollIntoView({
behavior:"smooth"
});


status.textContent =
"🔎 Pesquisando o tema...";


roteiro.textContent =
"Aguarde...\n\n" +
"🔎 Consultando literatura científica.";


try {

await esperar(500);


status.textContent =
"📚 Encontrando artigos no PubMed...";


const ids =
await pesquisarPubMed(
tema,
profundidade
);


status.textContent =
"📖 Recuperando títulos e resumos...";


const artigos =
await buscarArtigos(ids);


status.textContent =
"🧠 Analisando relevância dos estudos...";


const ordenados =
ordenarPorRelevancia(
artigos,
tema
);


await esperar(500);


status.textContent =
"✍️ Preparando roteiro baseado na pesquisa...";


const roteiroFinal =
gerarRoteiro(
tema,
duracao,
tipo,
profundidade,
ordenados,
narracao,
legenda,
musica,
referencias
);


const evidencias =
gerarEvidencias(
ordenados.slice(0,8)
);


roteiro.textContent =
roteiroFinal +
"\n\n" +
"━━━━━━━━━━━━━━━━━━━━\n\n" +
evidencias;


status.textContent =
"✅ Pesquisa concluída — " +
ordenados.length +
" artigo(s) analisado(s).";

}

catch(erro) {

console.error(erro);


status.textContent =
"⚠️ Ocorreu um problema na pesquisa.";


roteiro.textContent =
"Não foi possível completar a pesquisa.\n\n" +
erro.message;

}

}

</script>
