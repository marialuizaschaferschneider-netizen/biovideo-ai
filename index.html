<script>

async function gerarVideoBio() {

    const status = document.getElementById("videoStatus");
    const video = document.getElementById("videoPreview");
    const download = document.getElementById("downloadVideo");

    const tema =
        document.getElementById("tema")?.value?.trim() ||
        "Biotecnologia e o cérebro";

    const duracao =
        parseInt(
            document.getElementById("duracao")?.value || "1"
        );

    if (!status || !video || !download) {
        alert("Elementos do gerador de vídeo não foram encontrados.");
        return;
    }

    status.innerText = "🎬 Preparando o vídeo...";

    const canvas = document.createElement("canvas");

    canvas.width = 1080;
    canvas.height = 1920;

    const ctx = canvas.getContext("2d");

    if (!canvas.captureStream || !window.MediaRecorder) {
        status.innerText =
            "⚠️ Seu navegador não suporta a geração de vídeo.";
        return;
    }

    const stream = canvas.captureStream(30);

    const partes = [];

    const recorder = new MediaRecorder(stream, {
        mimeType: "video/webm"
    });

    recorder.ondataavailable = function(event) {

        if (event.data.size > 0) {
            partes.push(event.data);
        }

    };

    recorder.onstop = function() {

        const blob = new Blob(
            partes,
            { type: "video/webm" }
        );

        const url =
            URL.createObjectURL(blob);

        video.src = url;
        video.style.display = "block";

        download.href = url;
        download.style.display = "block";
        download.download = "BioVideoAI.webm";

        status.innerText =
            "✅ Vídeo criado com sucesso!";

    };


    const cenas = [

        {
            titulo: "INTRODUÇÃO",
            texto:
                "Você já parou para pensar como " +
                tema +
                " está presente no mundo?"
        },

        {
            titulo: "O QUE É?",
            texto:
                "Vamos entender os principais conceitos " +
                "científicos relacionados a esse assunto."
        },

        {
            titulo: "COMO FUNCIONA?",
            texto:
                "A ciência permite estudar esses processos " +
                "e compreender como eles funcionam."
        },

        {
            titulo: "APLICAÇÕES",
            texto:
                "A biotecnologia apresenta aplicações " +
                "em diferentes áreas da sociedade."
        },

        {
            titulo: "PESQUISA CIENTÍFICA",
            texto:
                "Pesquisas científicas ajudam a descobrir " +
                "novas possibilidades e também seus limites."
        },

        {
            titulo: "CONCLUSÃO",
            texto:
                "Conhecer a ciência ajuda a compreender " +
                "como novas tecnologias podem transformar a sociedade."
        }

    ];


    /* DURAÇÃO REAL ESCOLHIDA PELO USUÁRIO */

    const duracaoTotal =
        duracao * 60 * 1000;

    const duracaoCena =
        duracaoTotal / cenas.length;


    const inicio =
        performance.now();


    function quebrarTexto(texto, largura) {

        const palavras =
            texto.split(" ");

        const linhas = [];

        let linha = "";

        palavras.forEach(palavra => {

            const teste =
                linha + palavra + " ";

            if (
                ctx.measureText(teste).width >
                largura
            ) {

                linhas.push(linha);

                linha =
                    palavra + " ";

            } else {

                linha =
                    teste;

            }

        });

        if (linha) {
            linhas.push(linha);
        }

        return linhas;

    }


    function desenhar() {

        const agora =
            performance.now();

        const decorrido =
            agora - inicio;


        const indice =
            Math.min(
                Math.floor(
                    decorrido / duracaoCena
                ),
                cenas.length - 1
            );


        const cena =
            cenas[indice];


        /* FUNDO */

        ctx.fillStyle = "#123f30";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        /* ELEMENTOS ANIMADOS */

        for (let i = 0; i < 9; i++) {

            const x =
                120 + i * 120;

            const y =
                350 +
                Math.sin(
                    decorrido / 700 + i
                ) * 70;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                35,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "rgba(255,255,255,0.12)";

            ctx.fill();

        }


        /* MARCA */

        ctx.fillStyle = "white";

        ctx.textAlign = "center";

        ctx.font =
            "bold 58px Arial";

        ctx.fillText(
            "🧬 BioVideo AI",
            540,
            180
        );


        /* CENA */

        ctx.font =
            "bold 42px Arial";

        ctx.fillText(
            "CENA " + (indice + 1),
            540,
            520
        );


        /* TÍTULO */

        ctx.font =
            "bold 66px Arial";

        ctx.fillText(
            cena.titulo,
            540,
            700
        );


        /* TEXTO */

        ctx.font =
            "42px Arial";

        const linhas =
            quebrarTexto(
                cena.texto,
                850
            );


        linhas.forEach((linha, i) => {

            ctx.fillText(
                linha,
                540,
                900 + i * 70
            );

        });


        /* PROGRESSO */

        ctx.fillStyle =
            "rgba(255,255,255,0.25)";

        ctx.fillRect(
            100,
            1720,
            880,
            14
        );


        ctx.fillStyle = "white";

        ctx.fillRect(
            100,
            1720,
            880 *
            Math.min(
                decorrido / duracaoTotal,
                1
            ),
            14
        );


        /* CONTINUAR */

        if (decorrido < duracaoTotal) {

            requestAnimationFrame(
                desenhar
            );

        } else {

            recorder.stop();

        }

    }


    status.innerText =
        "🎥 Gerando vídeo de " +
        duracao +
        " minuto(s)...";


    recorder.start();

    desenhar();

}

</script>
