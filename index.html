<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioVideo AI</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef7f1;
color:#17352a
}
.container{
max-width:950px;
width:92%;
margin:auto;
padding:25px 0 50px
}
.header{text-align:center;padding:25px}
.logo{font-size:38px;font-weight:bold}
.subtitle{color:#60756b;margin-top:8px}
.card{
background:white;
border-radius:20px;
padding:24px;
margin-top:18px;
box-shadow:0 5px 20px #00000010
}
label{display:block;font-weight:bold;margin-bottom:8px}
textarea,select{
width:100%;
padding:14px;
border:1px solid #ccdcd3;
border-radius:12px;
font-size:16px;
background:white
}
textarea{min-height:130px}
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
margin-top:15px
}
button{
border:0;
border-radius:13px;
padding:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
background:#237a57;
color:white
}
button:hover{opacity:.9}
.secondary{background:#4b6f60}
.danger{background:#9b3d3d}
.status{
background:#edf8f1;
padding:15px;
border-radius:12px;
margin-bottom:15px
}
.scene{
border:1px solid #d6e4dc;
border-radius:15px;
padding:18px;
margin:15px 0;
background:#fafdfb
}
.scene h3{margin-top:0}
.reference{
padding:14px;
border-left:4px solid #237a57;
background:#f5faf7;
margin:10px 0;
border-radius:8px
}
.reference a{
color:#176544;
font-weight:bold
}
.hidden{display:none}
.small{font-size:13px;color:#65776f}
@media(max-width:650px){
.grid{grid-template-columns:1fr}
.logo{font-size:30px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">🧬 BioVideo AI</div>
<div class="subtitle">
Pesquisa científica • Roteiro • Narração • Legendas
</div>
</div>

<div class="card">

<label for="tema">Sobre o que será o vídeo?</label>

<textarea id="tema"
placeholder="Exemplo: Biotecnologia e o cérebro"></textarea>

<div class="grid">

<div>
<label>Duração</label>
<select id="duracao">
<option value="1">1 minuto</option>
<option value="2">2 minutos</option>
<option value="3">3 minutos</option>
<option value="4" selected>4 minutos</option>
</select>
</div>

<div>
<label>Tipo de vídeo</label>
<select id="tipo">
<option>Pesquisa</option>
<option>Educativo</option>
<option>Explicativo</option>
<option>Curiosidades</option>
</select>
</div>

<div>
<label>Pesquisa</label>
<select id="profundidade">
<option value="rapida">Rápida</option>
<option value="completa">Completa</option>
<option value="profunda" selected>Profunda</option>
</select>
</div>

<div>
<label>Voz</label>
<select id="voz">
<option>Carregando vozes...</option>
</select>
</div>

</div>

<button onclick="criarVideo()">
🚀 Criar roteiro
</button>

</div>


<div id="resultado" class="card hidden">

<div id="status" class="status">
Preparando...
</div>

<div id="controles">

<button onclick="ouvirRoteiro()">
▶️ Ouvir narração
</button>

<button class="secondary" onclick="pausarNarracao()">
⏸️ Pausar
</button>

<button class="danger" onclick="pararNarracao()">
⏹️ Parar
</button>

</div>

<div id="roteiro"></div>

</div>

</div>


<script>

/* =========================
BIOVIDEO AI V1.8
========================= */

const synth = window.speechSynthesis;

let vozes = [];
let textoNarracao = "";


/* VOZES */

function carregarVozes(){

if(!("speechSynthesis" in window)){

document.getElementById("voz").innerHTML =
"<option>Narração não suportada</option>";

return;

}

vozes = synth.getVoices();

const select =
document.getElementById("voz");

select.innerHTML="";


const brasileiras =
vozes.filter(v =>
v.lang.toLowerCase().startsWith("pt")
);


const lista =
brasileiras.length
? brasileiras
: vozes;


lista.forEach((voz,index)=>{

const option =
document.createElement("option");

option.value =
vozes.indexOf(voz);

option.textContent =
voz.name +
" (" +
voz.lang +
")";

select.appendChild(option);

});

}


carregarVozes();

if(synth.onvoiceschanged !== undefined){

synth.onvoiceschanged =
carregarVozes;

}


/* ESPERA */

function esperar(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}


/* DICIONÁRIO */

const palavras = {

"cérebro":"brain",
"cerebro":"brain",
"neurônio":"neuron",
"neuronio":"neuron",
"neurônios":"neurons",
"neuronios":"neurons",
"dna":"DNA",
"rna":"RNA",
"genética":"genetics",
"genetica":"genetics",
"biotecnologia":"biotechnology",
"medicina":"medicine",
"saúde":"health",
"saude":"health",
"doença":"disease",
"doenca":"disease",
"doenças":"diseases",
"doencas":"diseases",
"câncer":"cancer",
"cancer":"cancer",
"vacina":"vaccine",
"vacinas":"vaccines",
"agricultura":"agriculture",
"plantas":"plants",
"bactéria":"bacteria",
"bacteria":"bacteria",
"bactérias":"bacteria",
"bacterias":"bacteria",
"vírus":"virus",
"virus":"virus",
"psicologia":"psychology",
"memória":"memory",
"memoria":"memory",
"comportamento":"behavior"

};


/* TERMOS */

function gerarTermos(tema){

const original =
tema.toLowerCase().trim();

const partes =
original
.replace(/[?!.,;:()]/g,"")
.split(/\s+/);

const ingles = [];

partes.forEach(p=>{

if(palavras[p])
ingles.push(palavras[p]);

});

const termos=[original];

if(ingles.length)
termos.push(ingles.join(" AND "));

if(ingles.length>=2)
termos.push(
ingles.join(" AND ") +
"[Title/Abstract]"
);

return termos;

}


/* PUBMED */

async function pesquisar(tema,profundidade){

let limite=5;

if(profundidade==="completa")
limite=10;

if(profundidade==="profunda")
limite=15;

const termos=gerarTermos(tema);

const ids=[];
const usados=new Set();

for(const termo of termos){

try{

const url=
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi"+
"?db=pubmed"+
"&term="+encodeURIComponent(termo)+
"&retmax="+limite+
"&retmode=json"+
"&sort=relevance"+
"&tool=BioVideoAI";

const resposta=
await fetch(url);

const dados=
await resposta.json();

const encontrados=
dados.esearchresult.idlist || [];

encontrados.forEach(id=>{

if(!usados.has(id)){

usados.add(id);
ids.push(id);

}

});

await esperar(300);

}catch(e){

console.log(e);

}

}

return ids.slice(0,limite);

}


/* ARTIGOS */

async function artigos(ids){

if(!ids.length)
return [];

const url=
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi"+
"?db=pubmed"+
"&id="+ids.join(",")+
"&retmode=xml"+
"&tool=BioVideoAI";

const resposta=await fetch(url);

const xml=await resposta.text();

const doc=
new DOMParser()
.parseFromString(xml,"text/xml");

const encontrados=[];

doc.querySelectorAll("PubmedArticle")
.forEach(a=>{

const titulo=a.querySelector("ArticleTitle");
const pmid=a.querySelector("PMID");

let resumo="";

a.querySelectorAll("AbstractText")
.forEach(x=>{
resumo+=x.textContent+" ";
});

encontrados.push({

titulo:
titulo?
titulo.textContent:
"Título não disponível",

pmid:
pmid?
pmid.textContent:"",

resumo:
resumo.trim(),

link:
pmid?
"https://pubmed.ncbi.nlm.nih.gov/"+
pmid.textContent+"/":""

});

});

return encontrados;

}


/* ROTEIRO */

function criarCenas(
tema,
duracao,
artigos
){

const total=
duracao*60;

const cenaTempo=
Math.floor(total/6);

const cenas=[];

const modelos=[

[
"INTRODUÇÃO",
"Imagem ou animação relacionada diretamente ao tema.",
"Você já parou para pensar sobre "+tema+"? Neste vídeo vamos entender esse assunto de forma simples e baseada em pesquisas científicas.",
tema
],

[
"O QUE É?",
"Mostrar os principais elementos científicos relacionados ao assunto.",
"Primeiro, precisamos entender o que significa "+tema+" e quais são os conceitos fundamentais envolvidos.",
"O que é "+tema+"?"
],

[
"COMO FUNCIONA?",
"Animação mostrando o processo passo a passo.",
"Agora vamos entender como esse processo funciona e quais mecanismos científicos estão envolvidos.",
"Como funciona?"
],

[
"APLICAÇÕES",
"Mostrar exemplos reais de aplicações.",
"Uma das partes mais interessantes são as aplicações. A pesquisa científica investiga diferentes possibilidades relacionadas a esse campo.",
"Aplicações no mundo real"
],

[
"EVIDÊNCIAS",
"Laboratório, pesquisadores, artigos científicos e dados.",
"Os estudos científicos ajudam a compreender o que já sabemos, o que ainda está sendo investigado e quais são as limitações das evidências disponíveis.",
"O que dizem as pesquisas?"
],

[
"CONCLUSÃO",
"Retomar os principais elementos apresentados.",
"Em resumo, "+tema+" envolve ciência, tecnologia e diferentes possibilidades. Conhecer as evidências ajuda a compreender o assunto de maneira responsável.",
"Ciência transforma conhecimento em possibilidades."
]

];


for(let i=0;i<6;i++){

const inicio=i*cenaTempo;
const fim=(i+1)*cenaTempo;

cenas.push({

titulo:modelos[i][0],

tempo:
formatarTempo(inicio)+
" – "+
formatarTempo(fim),

visual:modelos[i][1],

narracao:modelos[i][2],

legenda:modelos[i][3]

});

}

return cenas;

}


/* TEMPO */

function formatarTempo(segundos){

const min=
Math.floor(segundos/60);

const seg=
segundos%60;

return min+
":"+
String(seg).padStart(2,"0");

}


/* EXIBIR */

function mostrarResultado(
tema,
duracao,
tipo,
artigosEncontrados
){

const resultado=
document.getElementById("resultado");

const roteiro=
document.getElementById("roteiro");

resultado.classList.remove("hidden");

const cenas=
criarCenas(
tema,
duracao,
artigosEncontrados
);


textoNarracao="";


let html="";

html+=
"<h2>🎬 Roteiro preparado</h2>";

html+=
"<p><b>Tema:</b> "+
tema+
"</p>";

html+=
"<p><b>Duração:</b> "+
duracao+
" minuto(s)</p>";

html+=
"<p><b>Tipo:</b> "+
tipo+
"</p>";


cenas.forEach((cena,i)=>{

html+=
'<div class="scene">';

html+=
"<h3>🎬 Cena "+
(i+1)+
" — "+
cena.titulo+
"</h3>";

html+=
"<p><b>⏱️ Tempo:</b> "+
cena.tempo+
"</p>";

html+=
"<p><b>🖼️ Visual:</b><br>"+
cena.visual+
"</p>";

html+=
"<p><b>🎙️ Narração:</b><br>"+
cena.narracao+
"</p>";

html+=
"<p><b>📝 Texto na tela:</b><br>"+
cena.legenda+
"</p>";

html+="</div>";


textoNarracao+=
cena.narracao+
" ";

});


html+=
"<h2>📚 Referências científicas</h2>";


if(!artigosEncontrados.length){

html+=
"<p>Nenhum artigo encontrado.</p>";

}else{

artigosEncontrados.forEach((a,i)=>{

html+=
'<div class="reference">';

html+=
"<b>"+(i+1)+
". "+
a.titulo+
"</b>";

if(a.pmid){

html+=
"<p class='small'>PMID: "+
a.pmid+
"</p>";

}

if(a.resumo){

html+=
"<p>"+
a.resumo+
"</p>";

}

if(a.link){

html+=
'<a href="'+
a.link+
'" target="_blank">'+
"🔗 Abrir artigo no PubMed"+
"</a>";

}

html+="</div>";

});

}


roteiro.innerHTML=html;

}


/* CRIAR */

async function criarVideo(){

const tema=
document.getElementById("tema")
.value.trim();

if(!tema){

alert(
"Digite o tema primeiro."
);

return;

}

const duracao=
parseInt(
document.getElementById("duracao").value
);

const tipo=
document.getElementById("tipo").value;

const profundidade=
document.getElementById("profundidade").value;

const resultado=
document.getElementById("resultado");

const status=
document.getElementById("status");

resultado.classList.remove("hidden");

status.textContent=
"🔎 Pesquisando artigos científicos...";

await esperar(300);

try{

const ids=
await pesquisar(
tema,
profundidade
);

status.textContent=
"📚 Recuperando artigos e resumos...";

const encontrados=
await artigos(ids);

status.textContent=
"🧠 Preparando roteiro...";

await esperar(500);

mostrarResultado(
tema,
duracao,
tipo,
encontrados
);

status.textContent=
"✅ Roteiro pronto! "+
encontrados.length+
" artigo(s) encontrado(s).";

}catch(e){

console.error(e);

status.textContent=
"⚠️ Erro ao pesquisar.";

}

}


/* NARRAÇÃO */

function ouvirRoteiro(){

if(!("speechSynthesis" in window)){

alert(
"Seu navegador não possui suporte à narração."
);

return;

}

synth.cancel();

const texto=
new SpeechSynthesisUtterance(
textoNarracao
);

const select=
document.getElementById("voz");

const indice=
parseInt(select.value);

if(vozes[indice]){

texto.voice=
vozes[indice];

}

texto.lang="pt-BR";
texto.rate=0.95;
texto.pitch=1;
texto.volume=1;

synth.speak(texto);

}


function pausarNarracao(){

if(synth.speaking)
synth.pause();

}


function pararNarracao(){

synth.cancel();

}

</script>

</body>
</html>
