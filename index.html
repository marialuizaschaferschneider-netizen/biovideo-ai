/* ---------- ESPERA ---------- */

function esperar(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}

/* ---------- TRANSFORMA TEMA EM TERMOS ---------- */

function gerarTermosDePesquisa(tema) {

    const texto =
        tema
        .toLowerCase()
        .trim();

    const palavras =
        texto
        .replace(/[?!.,;:()]/g, "")
        .split(/\s+/);

    const traduzidas = [];

    palavras.forEach(palavra => {

        if (dicionario[palavra]) {

            traduzidas.push(
                dicionario[palavra]
            );

        }

    });


    const termos = [];


    /* Tema original */

    termos.push(
        texto
    );


    /* Palavras traduzidas */

    if (traduzidas.length > 0) {

        termos.push(
            traduzidas.join(" AND ")
        );

    }


    /* Combinações */

    if (traduzidas.length >= 2) {

        termos.push(
            "(" +
            traduzidas.join(" AND ") +
            ")[Title/Abstract]"
        );

    }


    return termos;

}


/* ---------- PESQUISA PUBMED ---------- */

async function pesquisarPubMed(tema, profundidade) {

    const termos =
        gerarTermosDePesquisa(tema);


    let limite = 5;

    if (profundidade === "completa") {
        limite = 10;
    }

    if (profundidade === "profunda") {
        limite = 15;
    }


    const ids = [];
    const usados = new Set();


    for (const termo of termos) {

        try {

            const url =
                "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi" +
                "?db=pubmed" +
                "&term=" +
                encodeURIComponent(termo) +
                "&retmax=" +
                limite +
                "&retmode=json" +
                "&sort=relevance" +
                "&tool=BioVideoAI";


            const resposta =
                await fetch(url);


            if (!resposta.ok) {
                continue;
            }


            const dados =
                await resposta.json();


            const encontrados =
                dados
                .esearchresult
                .idlist || [];


            encontrados.forEach(id => {

                if (!usados.has(id)) {

                    usados.add(id);
                    ids.push(id);

                }

            });


            await esperar(400);

        }

        catch (erro) {

            console.log(
                "Erro em uma busca:",
                erro
            );

        }

    }


    return ids.slice(0, limite);

}


/* ---------- RECUPERAR ARTIGOS ---------- */

async function buscarArtigos(ids) {

    if (ids.length === 0) {
        return [];
    }


    const url =
        "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi" +
        "?db=pubmed" +
        "&id=" +
        ids.join(",") +
        "&retmode=xml" +
        "&tool=BioVideoAI";


    const resposta =
        await fetch(url);


    if (!resposta.ok) {

        throw new Error(
            "Não foi possível recuperar os artigos."
        );

    }


    const xml =
        await resposta.text();


    const documento =
        new DOMParser()
        .parseFromString(
            xml,
            "text/xml"
        );


    const artigosXML =
        documento.querySelectorAll(
            "PubmedArticle"
        );


    const artigos = [];


    artigosXML.forEach(artigo => {

        const titulo =
            artigo.querySelector(
                "ArticleTitle"
            );


        const pmid =
            artigo.querySelector(
                "PMID"
            );


        const partes =
            artigo.querySelectorAll(
                "AbstractText"
            );


        let resumo = "";


        partes.forEach(parte => {

            resumo +=
                parte.textContent +
                " ";

        });


        artigos.push({

            titulo:
                titulo
                ? titulo.textContent
                : "Título não disponível",

            resumo:
                resumo.trim(),

            pmid:
                pmid
                ? pmid.textContent
                : "",

            link:
                pmid
                ? "https://pubmed.ncbi.nlm.nih.gov/" +
                  pmid.textContent +
                  "/"
                : ""

        });

    });


    return artigos;

}


/* ---------- ESCOLHER PALAVRAS DO TEMA ---------- */

function palavrasPrincipais(tema) {

    const ignoradas = [

        "como",
        "para",
        "sobre",
        "uma",
        "umas",
        "uns",
        "dos",
        "das",
        "que",
        "qual",
        "quais",
        "isso",
        "isso",
        "ela",
        "ele",
        "eles",
        "elas",
        "com",
        "sem",
        "por",
        "uma",
        "um",
        "e",
        "ou",
        "de",
        "da",
        "do",
        "em",
        "na",
        "no"

    ];


    return tema
        .toLowerCase()
        .replace(/[?!.,;:()]/g, "")
        .split(/\s+/)
        .filter(
            palavra =>
                palavra.length > 3 &&
                !ignoradas.includes(palavra)
        );

}

    const roteiro =
        document.getElementById(
            "roteiro"
        );

    const status =
        document.getElementById(
            "status"
        );


    const tema =
        document.getElementById(
            "tema"
        ).value.trim();


    const duracao =
        parseInt(
            document.getElementById(
                "duracao"
            ).value
        );


    const tipo =
        document.getElementById(
            "tipo"
        ).value;


    const profundidade =
        document.getElementById(
            "profundidade"
        ).value;


    const narracao =
        document.getElementById(
            "usarNarracao"
        ).checked;


    const legenda =
        document.getElementById(
            "usarLegenda"
        ).checked;


    const musica =
        document.getElementById(
            "usarMusica"
        ).checked;


    const referencias =
        document.getElementById(
            "usarReferencias"
        ).checked;


    if (!tema) {

        alert(
            "Digite o tema do vídeo primeiro."
        );

        return;

    }


    resultado.style.display =
        "block";


    resultado.scrollIntoView({
        behavior: "smooth"
    });


    status.textContent =
        "🔎 Pesquisando artigos científicos sobre: " +
        tema;


    roteiro.textContent =
        "Aguarde...\n\n" +
        "🔎 Pesquisa iniciada.";


    try {

        await esperar(500);


        status.textContent =
            "📚 Procurando estudos no PubMed...";


        const ids =
            await pesquisarPubMed(
                tema,
                profundidade
            );


        status.textContent =
            "📖 Recuperando informações dos artigos...";


        const artigos =
            await buscarArtigos(ids);


        status.textContent =
            "🧠 Organizando pesquisa e preparando o roteiro...";


        await esperar(500);


        const resultadoFinal =
            gerarRoteiro(
                tema,
                duracao,
                tipo,
                profundidade,
                artigos,
                narracao,
                legenda,
                musica,
                referencias
            );


        roteiro.textContent =
            resultadoFinal;


        status.textContent =
            "✅ Roteiro preparado! " +
            artigos.length +
            " artigo(s) científico(s) encontrado(s).";


    }

    catch (erro) {

        console.error(erro);


        status.textContent =
            "⚠️ A pesquisa encontrou um problema.";


        roteiro.textContent =
            "Não foi possível completar a pesquisa.\n\n" +
            "Erro: " +
            erro.message +
            "\n\n" +
            "Você pode tentar novamente.";

    }

}

</script>

</body>
</html>
