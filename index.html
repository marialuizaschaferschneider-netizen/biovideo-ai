<script>

async function gerarVideoBio(){

    const tema =
        document.getElementById("tema")?.value ||
        "Biotecnologia e o cérebro";

    const duracao =
        parseInt(
            document.getElementById("duracao")?.value || 1
        );

    const status =
        document.getElementById("videoStatus");

    const preview =
        document.getElementById("videoPreview");

    const download =
        document.getElementById("downloadVideo");

    status.innerText =
        "🎬 Preparando o vídeo...";

    preview.style.display = "none";
    download.style.display = "none";


    const canvas =
        document.createElement("canvas");

    canvas.width = 1080;
    canvas.height = 1920;

    const ctx =
        canvas.getContext("2d");


    const stream =
        canvas.captureStream(30);


    let mimeType = "video/webm";

    if(
        MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9"
        )
    ){

        mimeType =
            "video/webm;codecs=vp9";

    }
    else if(
        MediaRecorder.isTypeSupported(
            "video/webm"
        )
    ){

        mimeType =
            "video/webm";

    }


    const recorder =
        new MediaRecorder(
            stream,
            {
                mimeType:mimeType,
                videoBitsPerSecond:5000000
            }
        );


    const chunks=[];


    recorder.ondataavailable =
        function(event){

            if(event.data.size > 0){

                chunks.push(
                    event.data
                );

            }

        };


    const videoBlobPromise =
        new Promise(resolve => {

            recorder.onstop =
                function(){

                    resolve(
                        new Blob(
                            chunks,
                            {
                                type:mimeType
                            }
                        )
                    );

                };

        });


    recorder.start();


    const cenas = [

        {
            titulo:"INTRODUÇÃO",
            texto:
            "Você já parou para pensar como " +
            tema +
            " está presente no mundo?"
        },

        {
            titulo:"O QUE É?",
            texto:
            "Vamos entender os principais conceitos " +
            "relacionados a esse assunto."
        },

        {
            titulo:"COMO FUNCIONA?",
            texto:
            "A ciência permite estudar esses processos " +
            "e compreender como eles funcionam."
        },

        {
            titulo:"APLICAÇÕES",
            texto:
            "A biotecnologia pode gerar aplicações " +
            "em diferentes áreas da sociedade."
        },

        {
            titulo:"PESQUISA CIENTÍFICA",
            texto:
            "Pesquisas científicas ajudam a descobrir " +
            "novas possibilidades e também seus limites."
        },

        {
            titulo:"CONCLUSÃO",
            texto:
            "Conhecimento científico ajuda a transformar " +
            "possibilidades em novas descobertas."
        }

    ];


    const tempoTotal =
        duracao * 60 * 1000;

    const tempoCena =
        tempoTotal / cenas.length;


    const inicio =
        performance.now();


    function desenhar(){

        const agora =
            performance.now();

        const decorrido =
            agora - inicio;


        const indice =
            Math.min(
                Math.floor(
                    decorrido / tempoCena
                ),
                cenas.length - 1
            );


        const progresso =
            (
                decorrido %
                tempoCena
            ) / tempoCena;


        const cena =
            cenas[indice];


        /* FUNDO */

        const gradiente =
            ctx.createLinearGradient(
                0,0,
                1080,1920
            );

        gradiente.addColorStop(
            0,
            "#0c3327"
        );

        gradiente.addColorStop(
            1,
            "#1e7655"
        );

        ctx.fillStyle =
            gradiente;

        ctx.fillRect(
            0,0,
            1080,1920
        );


        /* CÍRCULOS ANIMADOS */

        for(let i=0;i<8;i++){

            const x =
                100 +
                i*140;

            const y =
                300 +
                Math.sin(
                    progresso * Math.PI * 2 +
                    i
                ) * 80;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                35,
                0,
                Math.PI*2
            );

            ctx.fillStyle =
                "rgba(255,255,255,.15)";

            ctx.fill();

        }


        /* LOGO */

        ctx.fillStyle =
            "white";

        ctx.font =
            "bold 54px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "🧬 BioVideo AI",
            540,
            180
        );


        /* CENA */

        ctx.font =
            "bold 70px Arial";

        ctx.fillText(
            cena.titulo,
            540,
            650
        );


        /* TEXTO */

        ctx.font =
            "42px Arial";

        const linhas =
            quebrarTexto(
                cena.texto,
                850
            );


        linhas.forEach(
            (linha,i)=>{

                ctx.fillText(
                    linha,
                    540,
                    850 + i*65
                );

            }
        );


        /* BARRA DE PROGRESSO */

        ctx.fillStyle =
            "rgba(255,255,255,.25)";

        ctx.fillRect(
            100,
            1730,
            880,
            10
        );


        ctx.fillStyle =
            "white";

        ctx.fillRect(
            100,
            1730,
            880 * (
                decorrido /
                tempoTotal
            ),
            10
        );


        if(
            decorrido <
            tempoTotal
        ){

            requestAnimationFrame(
                desenhar
            );

        }
        else{

            recorder.stop();

            status.innerText =
                "⏳ Finalizando o vídeo...";

        }

    }


    function quebrarTexto(
        texto,
        largura
    ){

        const palavras =
            texto.split(" ");

        const linhas=[];

        let linha="";


        palavras.forEach(
            palavra=>{

                const teste =
                    linha +
                    palavra +
                    " ";

                if(
                    ctx.measureText(
                        teste
                    ).width >
                    largura
                ){

                    linhas.push(
                        linha
                    );

                    linha =
                        palavra +
                        " ";

                }
                else{

                    linha =
                        teste;

                }

            }
        );


        if(linha)
            linhas.push(linha);


        return linhas;

    }


    desenhar();


    const blob =
        await videoBlobPromise;


    const url =
        URL.createObjectURL(
            blob
        );


    preview.src =
        url;

    preview.style.display =
        "block";


    download.href =
        url;

    download.style.display =
        "block";


    download.download =
        "BioVideoAI-" +
        tema
        .replace(
            /[^a-z0-9]/gi,
            "-"
        ) +
        ".webm";


    status.innerText =
        "✅ Vídeo criado!";

}

</script>

<script>

/* =========================
BIOVIDEO AI V1.8
========================= */

const synth = window.speechSynthesis;

let vozes = [];
let textoNarracao = "";


/* VOZES */

function carregarVozes(){

if(!("speechSynthesis" in window)){

document.getElementById("voz").innerHTML =
"<option>Narração não suportada</option>";

return;

}

vozes = synth.getVoices();

const select =
document.getElementById("voz");

select.innerHTML="";


const brasileiras =
vozes.filter(v =>
v.lang.toLowerCase().startsWith("pt")
);


const lista =
brasileiras.length
? brasileiras
: vozes;


lista.forEach((voz,index)=>{

const option =
document.createElement("option");

option.value =
vozes.indexOf(voz);

option.textContent =
voz.name +
" (" +
voz.lang +
")";

select.appendChild(option);

});

}


carregarVozes();

if(synth.onvoiceschanged !== undefined){

synth.onvoiceschanged =
carregarVozes;

}


/* ESPERA */

function esperar(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}


/* DICIONÁRIO */

const palavras = {

"cérebro":"brain",
"cerebro":"brain",
"neurônio":"neuron",
"neuronio":"neuron",
"neurônios":"neurons",
"neuronios":"neurons",
"dna":"DNA",
"rna":"RNA",
"genética":"genetics",
"genetica":"genetics",
"biotecnologia":"biotechnology",
"medicina":"medicine",
"saúde":"health",
"saude":"health",
"doença":"disease",
"doenca":"disease",
"doenças":"diseases",
"doencas":"diseases",
"câncer":"cancer",
"cancer":"cancer",
"vacina":"vaccine",
"vacinas":"vaccines",
"agricultura":"agriculture",
"plantas":"plants",
"bactéria":"bacteria",
"bacteria":"bacteria",
"bactérias":"bacteria",
"bacterias":"bacteria",
"vírus":"virus",
"virus":"virus",
"psicologia":"psychology",
"memória":"memory",
"memoria":"memory",
"comportamento":"behavior"

};


/* TERMOS */

function gerarTermos(tema){

const original =
tema.toLowerCase().trim();

const partes =
original
.replace(/[?!.,;:()]/g,"")
.split(/\s+/);

const ingles = [];

partes.forEach(p=>{

if(palavras[p])
ingles.push(palavras[p]);

});

const termos=[original];

if(ingles.length)
termos.push(ingles.join(" AND "));

if(ingles.length>=2)
termos.push(
ingles.join(" AND ") +
"[Title/Abstract]"
);

return termos;

}


/* PUBMED */

async function pesquisar(tema,profundidade){

let limite=5;

if(profundidade==="completa")
limite=10;

if(profundidade==="profunda")
limite=15;

const termos=gerarTermos(tema);

const ids=[];
const usados=new Set();

for(const termo of termos){

try{

const url=
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi"+
"?db=pubmed"+
"&term="+encodeURIComponent(termo)+
"&retmax="+limite+
"&retmode=json"+
"&sort=relevance"+
"&tool=BioVideoAI";

const resposta=
await fetch(url);

const dados=
await resposta.json();

const encontrados=
dados.esearchresult.idlist || [];

encontrados.forEach(id=>{

if(!usados.has(id)){

usados.add(id);
ids.push(id);

}

});

await esperar(300);

}catch(e){

console.log(e);

}

}

return ids.slice(0,limite);

}


/* ARTIGOS */

async function artigos(ids){

if(!ids.length)
return [];

const url=
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi"+
"?db=pubmed"+
"&id="+ids.join(",")+
"&retmode=xml"+
"&tool=BioVideoAI";

const resposta=await fetch(url);

const xml=await resposta.text();

const doc=
new DOMParser()
.parseFromString(xml,"text/xml");

const encontrados=[];

doc.querySelectorAll("PubmedArticle")
.forEach(a=>{

const titulo=a.querySelector("ArticleTitle");
const pmid=a.querySelector("PMID");

let resumo="";

a.querySelectorAll("AbstractText")
.forEach(x=>{
resumo+=x.textContent+" ";
});

encontrados.push({

titulo:
titulo?
titulo.textContent:
"Título não disponível",

pmid:
pmid?
pmid.textContent:"",

resumo:
resumo.trim(),

link:
pmid?
"https://pubmed.ncbi.nlm.nih.gov/"+
pmid.textContent+"/":""

});

});

return encontrados;

}


/* ROTEIRO */

function criarCenas(
tema,
duracao,
artigos
){

const total=
duracao*60;

const cenaTempo=
Math.floor(total/6);

const cenas=[];

const modelos=[

[
"INTRODUÇÃO",
"Imagem ou animação relacionada diretamente ao tema.",
"Você já parou para pensar sobre "+tema+"? Neste vídeo vamos entender esse assunto de forma simples e baseada em pesquisas científicas.",
tema
],

[
"O QUE É?",
"Mostrar os principais elementos científicos relacionados ao assunto.",
"Primeiro, precisamos entender o que significa "+tema+" e quais são os conceitos fundamentais envolvidos.",
"O que é "+tema+"?"
],

[
"COMO FUNCIONA?",
"Animação mostrando o processo passo a passo.",
"Agora vamos entender como esse processo funciona e quais mecanismos científicos estão envolvidos.",
"Como funciona?"
],

[
"APLICAÇÕES",
"Mostrar exemplos reais de aplicações.",
"Uma das partes mais interessantes são as aplicações. A pesquisa científica investiga diferentes possibilidades relacionadas a esse campo.",
"Aplicações no mundo real"
],

[
"EVIDÊNCIAS",
"Laboratório, pesquisadores, artigos científicos e dados.",
"Os estudos científicos ajudam a compreender o que já sabemos, o que ainda está sendo investigado e quais são as limitações das evidências disponíveis.",
"O que dizem as pesquisas?"
],

[
"CONCLUSÃO",
"Retomar os principais elementos apresentados.",
"Em resumo, "+tema+" envolve ciência, tecnologia e diferentes possibilidades. Conhecer as evidências ajuda a compreender o assunto de maneira responsável.",
"Ciência transforma conhecimento em possibilidades."
]

];


for(let i=0;i<6;i++){

const inicio=i*cenaTempo;
const fim=(i+1)*cenaTempo;

cenas.push({

titulo:modelos[i][0],

tempo:
formatarTempo(inicio)+
" – "+
formatarTempo(fim),

visual:modelos[i][1],

narracao:modelos[i][2],

legenda:modelos[i][3]

});

}

return cenas;

}


/* TEMPO */

function formatarTempo(segundos){

const min=
Math.floor(segundos/60);

const seg=
segundos%60;

return min+
":"+
String(seg).padStart(2,"0");

}


/* EXIBIR */

function mostrarResultado(
tema,
duracao,
tipo,
artigosEncontrados
){

const resultado=
document.getElementById("resultado");

const roteiro=
document.getElementById("roteiro");

resultado.classList.remove("hidden");

const cenas=
criarCenas(
tema,
duracao,
artigosEncontrados
);


textoNarracao="";


let html="";

html+=
"<h2>🎬 Roteiro preparado</h2>";

html+=
"<p><b>Tema:</b> "+
tema+
"</p>";

html+=
"<p><b>Duração:</b> "+
duracao+
" minuto(s)</p>";

html+=
"<p><b>Tipo:</b> "+
tipo+
"</p>";


cenas.forEach((cena,i)=>{

html+=
'<div class="scene">';

html+=
"<h3>🎬 Cena "+
(i+1)+
" — "+
cena.titulo+
"</h3>";

html+=
"<p><b>⏱️ Tempo:</b> "+
cena.tempo+
"</p>";

html+=
"<p><b>🖼️ Visual:</b><br>"+
cena.visual+
"</p>";

html+=
"<p><b>🎙️ Narração:</b><br>"+
cena.narracao+
"</p>";

html+=
"<p><b>📝 Texto na tela:</b><br>"+
cena.legenda+
"</p>";

html+="</div>";


textoNarracao+=
cena.narracao+
" ";

});


html+=
"<h2>📚 Referências científicas</h2>";


if(!artigosEncontrados.length){

html+=
"<p>Nenhum artigo encontrado.</p>";

}else{

artigosEncontrados.forEach((a,i)=>{

html+=
'<div class="reference">';

html+=
"<b>"+(i+1)+
". "+
a.titulo+
"</b>";

if(a.pmid){

html+=
"<p class='small'>PMID: "+
a.pmid+
"</p>";

}

if(a.resumo){

html+=
"<p>"+
a.resumo+
"</p>";

}

if(a.link){

html+=
'<a href="'+
a.link+
'" target="_blank">'+
"🔗 Abrir artigo no PubMed"+
"</a>";

}

html+="</div>";

});

}


roteiro.innerHTML=html;

}


/* CRIAR */

async function criarVideo(){

const tema=
document.getElementById("tema")
.value.trim();

if(!tema){

alert(
"Digite o tema primeiro."
);

return;

}

const duracao=
parseInt(
document.getElementById("duracao").value
);

const tipo=
document.getElementById("tipo").value;

const profundidade=
document.getElementById("profundidade").value;

const resultado=
document.getElementById("resultado");

const status=
document.getElementById("status");

resultado.classList.remove("hidden");

status.textContent=
"🔎 Pesquisando artigos científicos...";

await esperar(300);

try{

const ids=
await pesquisar(
tema,
profundidade
);

status.textContent=
"📚 Recuperando artigos e resumos...";

const encontrados=
await artigos(ids);

status.textContent=
"🧠 Preparando roteiro...";

await esperar(500);

mostrarResultado(
tema,
duracao,
tipo,
encontrados
);

status.textContent=
"✅ Roteiro pronto! "+
encontrados.length+
" artigo(s) encontrado(s).";

}catch(e){

console.error(e);

status.textContent=
"⚠️ Erro ao pesquisar.";

}

}


/* NARRAÇÃO */

function ouvirRoteiro(){

if(!("speechSynthesis" in window)){

alert(
"Seu navegador não possui suporte à narração."
);

return;

}

synth.cancel();

const texto=
new SpeechSynthesisUtterance(
textoNarracao
);

const select=

<script>
async function gerarVideoBio() {

    const status = document.getElementById("videoStatus");

    if (!status) {
        alert("Área do gerador não encontrada.");
        return;
    }

    status.innerText = "🎬 Preparando o vídeo...";

    const tema =
        document.getElementById("tema")?.value ||
        "Biotecnologia e o cérebro";

    const duracao =
        parseInt(
            document.getElementById("duracao")?.value || "1"
        );

    const canvas = document.createElement("canvas");

    canvas.width = 1080;
    canvas.height = 1920;

    const ctx = canvas.getContext("2d");

    if (!canvas.captureStream || !window.MediaRecorder) {
        status.innerText =
            "⚠️ Seu navegador não suporta a geração de vídeo.";
        return;
    }

    const stream = canvas.captureStream(30);

    const chunks = [];

    const recorder = new MediaRecorder(stream);

    recorder.ondataavailable = function(event) {

        if (event.data.size > 0) {
            chunks.push(event.data);
        }

    };

    recorder.onstop = function() {

        const blob = new Blob(
            chunks,
            { type: "video/webm" }
        );

        const url =
            URL.createObjectURL(blob);

        const video =
            document.getElementById("videoPreview");

        const download =
            document.getElementById("downloadVideo");

        if (video) {
            video.src = url;
            video.style.display = "block";
        }

        if (download) {
            download.href = url;
            download.style.display = "block";
            download.innerText =
                "⬇️ Salvar vídeo";
        }

        status.innerText =
            "✅ Vídeo criado!";
    };

    recorder.start();

    const inicio = Date.now();

    const duracaoMs =
        duracao * 1000;

    function desenhar() {

        const tempo =
            Date.now() - inicio;

        const progresso =
            Math.min(
                tempo / duracaoMs,
                1
            );

        ctx.fillStyle = "#123f30";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        ctx.fillStyle = "white";

        ctx.textAlign = "center";

        ctx.font = "bold 70px Arial";

        ctx.fillText(
            "🧬 BioVideo AI",
            540,
            300
        );

        ctx.font = "bold 60px Arial";

        ctx.fillText(
            tema,
            540,
            800
        );

        ctx.font = "40px Arial";

        ctx.fillText(
            "Vídeo educativo",
            540,
            950
        );

        ctx.fillStyle =
            "rgba(255,255,255,.3)";

        ctx.fillRect(
            100,
            1650,
            880,
            15
        );

        ctx.fillStyle = "white";

        ctx.fillRect(
            100,
            1650,
            880 * progresso,
            15
        );

        if (progresso < 1) {

            requestAnimationFrame(
                desenhar
            );

        } else {

            recorder.stop();

        }

    }

    status.innerText =
        "🎥 Gravando o vídeo...";

    desenhar();
}
</script>
</body>
