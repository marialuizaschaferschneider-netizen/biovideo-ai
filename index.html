<script>

"use strict";


/* =========================
   VARIÁVEIS
========================= */

const synth =
window.speechSynthesis;

let vozes = [];

let cenasAtuais = [];

let textoNarracao = "";


/* =========================
   VOZES
========================= */

function carregarVozes(){

if(!synth) return;

vozes =
synth.getVoices();

const select =
document.getElementById("voz");

select.innerHTML = "";

const brasileiras =
vozes.filter(function(v){

return v.lang &&
v.lang.toLowerCase()
.startsWith("pt");

});

const lista =
brasileiras.length ?
brasileiras :
vozes;

lista.forEach(function(v){

const option =
document.createElement("option");

option.value =
vozes.indexOf(v);

option.textContent =
v.name +
" (" +
v.lang +
")";

select.appendChild(option);

});

}

carregarVozes();

if(
synth.onvoiceschanged !== undefined
){

synth.onvoiceschanged =
carregarVozes;

}


/* =========================
   TERMOS
========================= */

const termos = {

"cérebro":"brain",
"cerebro":"brain",

"neurônio":"neuron",
"neuronio":"neuron",

"neurônios":"neurons",
"neuronios":"neurons",

"dna":"DNA",
"rna":"RNA",

"genética":"genetics",
"genetica":"genetics",

"biotecnologia":"biotechnology",

"medicina":"medicine",

"saúde":"health",
"saude":"health",

"doença":"disease",
"doenca":"disease",

"câncer":"cancer",
"cancer":"cancer",

"vacina":"vaccine",
"vacinas":"vaccines",

"agricultura":"agriculture",

"plantas":"plants",

"bactéria":"bacteria",
"bacteria":"bacteria",

"vírus":"virus",
"virus":"virus",

"psicologia":"psychology",

"memória":"memory",
"memoria":"memory",

"comportamento":"behavior"

};


/* =========================
   TERMOS DE PESQUISA
========================= */

function gerarTermos(tema){

const partes =
tema
.toLowerCase()
.replace(/[?!.,;:()]/g,"")
.split(/\s+/);

const ingles = [];

partes.forEach(function(p){

if(termos[p])
ingles.push(termos[p]);

});

const lista = [tema];

if(ingles.length){

lista.push(
ingles.join(" AND ")
);

}

return lista;

}


/* =========================
   PUBMED
========================= */

async function pesquisar(
tema,
profundidade
){

let limite = 5;

if(
profundidade === "completa"
)
limite = 10;

if(
profundidade === "profunda"
)
limite = 15;


const termosPesquisa =
gerarTermos(tema);

const ids = [];

const usados = {};


for(
let i=0;
i<termosPesquisa.length;
i++
){

try{

const url =
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi" +

"?db=pubmed" +

"&term=" +
encodeURIComponent(
termosPesquisa[i]
) +

"&retmax=" +
limite +

"&retmode=json" +

"&sort=relevance" +

"&tool=BioVideoAI";


const resposta =
await fetch(url);

const dados =
await resposta.json();


const encontrados =
dados
.esearchresult
.idlist || [];


encontrados.forEach(function(id){

if(!usados[id]){

usados[id] = true;

ids.push(id);

}

});

}
catch(e){

console.log(e);

}

}


return ids.slice(
0,
limite
);

}


/* =========================
   ARTIGOS
========================= */

async function buscarArtigos(ids){

if(!ids.length)
return [];


try{

const url =
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi" +

"?db=pubmed" +

"&id=" +
ids.join(",") +

"&retmode=xml" +

"&tool=BioVideoAI";


const resposta =
await fetch(url);

const xml =
await resposta.text();


const doc =
new DOMParser()
.parseFromString(
xml,
"text/xml"
);


const lista = [];


doc
.querySelectorAll(
"PubmedArticle"
)
.forEach(function(a){

const titulo =
a.querySelector(
"ArticleTitle"
);

const pmid =
a.querySelector(
"PMID"
);


let resumo = "";


a
.querySelectorAll(
"AbstractText"
)
.forEach(function(x){

resumo +=
x.textContent +
" ";

});


lista.push({

titulo:
titulo ?
titulo.textContent :
"Título não disponível",

pmid:
pmid ?
pmid.textContent :
"",

resumo:
resumo.trim(),

link:
pmid ?
"https://pubmed.ncbi.nlm.nih.gov/" +
pmid.textContent +
"/" :
""

});

});


return lista;

}
catch(e){

console.log(e);

return [];

}

}


/* =========================
   TEMPO
========================= */

function formatarTempo(segundos){

return (

Math.floor(
segundos / 60
)

+

":"

+

String(
Math.floor(
segundos % 60
)
)
.padStart(
2,
"0"
)

);

}


/* =========================
   CENAS
========================= */

function criarCenas(
tema,
duracao
){

const total =
duracao * 60;

const parte =
total / 6;


const dados = [

[

"INTRODUÇÃO",

"Imagem ou animação relacionada diretamente ao tema.",

"Você já parou para pensar sobre " +
tema +
"? Neste vídeo vamos entender esse assunto de forma simples e baseada em ciência.",

"Conheça o tema"

],

[

"O QUE É?",

"Mostrar os principais conceitos científicos relacionados ao assunto.",

"Primeiro, vamos entender o que significa " +
tema +
" e quais são os conceitos fundamentais envolvidos.",

"O que é?"

],

[

"COMO FUNCIONA?",

"Animação mostrando o processo de forma didática.",

"Agora vamos entender como esse processo funciona e quais mecanismos científicos estão envolvidos.",

"Como funciona?"

],

[

"APLICAÇÕES",

"Mostrar exemplos de aplicações no mundo real.",

"A pesquisa científica investiga diferentes aplicações e possibilidades relacionadas a esse campo.",

"Aplicações reais"

],

[

"EVIDÊNCIAS CIENTÍFICAS",

"Mostrar laboratório, pesquisadores e artigos científicos.",

"Os estudos científicos ajudam a compreender o que já sabemos, o que ainda está sendo investigado e quais são as limitações das evidências.",

"O que dizem as pesquisas?"

],

[

"CONCLUSÃO",

"Retomar os principais pontos apresentados.",

"Em resumo, " +
tema +
" envolve ciência, tecnologia e diferentes possibilidades. Conhecer as evidências ajuda a compreender o assunto de maneira responsável.",

"Conclusão"

]

];


const cenas = [];


for(
let i=0;
i<6;
i++
){

const inicio =
i * parte;

const fim =
i === 5 ?
total :
(i + 1) * parte;


cenas.push({

titulo:
dados[i][0],

visual:
dados[i][1],

narracao:
dados[i][2],

legenda:
dados[i][3],

inicio:
inicio,

fim:
fim,

tempo:
formatarTempo(inicio) +
" – " +
formatarTempo(fim)

});

}


return cenas;

}


/* =========================
   MOSTRAR ROTEIRO
========================= */

function mostrarResultado(
tema,
duracao,
tipo,
artigos
){

cenasAtuais =
criarCenas(
tema,
duracao
);


textoNarracao = "";


let html =
"<h2>🎬 Roteiro preparado!</h2>";


html +=
"<p><b>Tema:</b> " +
tema +
"</p>";


html +=
"<p><b>Duração:</b> " +
duracao +
" minuto(s)</p>";


html +=
"<p><b>Tipo:</b> " +
tipo +
"</p>";


cenasAtuais.forEach(
function(cena,i){

html +=
'<div class="scene">';


html +=
"<h3>🎬 Cena " +
(i + 1) +
" — " +
cena.titulo +
"</h3>";


html +=
"<p><b>⏱️ Tempo:</b> " +
cena.tempo +
"</p>";


html +=
"<p><b>🖼️ Visual:</b> " +
cena.visual +
"</p>";


html +=
"<p><b>🎙️ Narração:</b> " +
cena.narracao +
"</p>";


html +=
"<p><b>📝 Texto na tela:</b> " +
cena.legenda +
"</p>";


html +=
"</div>";


textoNarracao +=
cena.narracao +
" ";

});


html +=
"<h2>📚 Referências científicas</h2>";


if(!artigos.length){

html +=
"<p>Nenhum artigo encontrado para esse tema.</p>";

}


artigos.forEach(
function(a,i){

html +=
'<div class="reference">';


html +=
"<b>" +
(i + 1) +
". " +
a.titulo +
"</b>";


if(a.pmid){

html +=
"<p class='small'>PMID: " +
a.pmid +
"</p>";

}


if(a.resumo){

html +=
"<p>" +
a.resumo +
"</p>";

}


if(a.link){

html +=
'<a href="' +
a.link +
'" target="_blank">' +
"🔗 Abrir artigo no PubMed" +
"</a>";

}


html +=
"</div>";

});


document
.getElementById(
"roteiro"
)
.innerHTML = html;


document
.getElementById(
"resultado"
)
.classList
.remove("hidden");

}


/* =========================
   CRIAR ROTEIRO
========================= */

async function criarRoteiro(){

const tema =
document
.getElementById("tema")
.value
.trim();


if(!tema){

alert(
"Digite o tema primeiro."
);

return;

}


const duracao =
parseInt(
document
.getElementById("duracao")
.value,
10
);


const tipo =
document
.getElementById("tipo")
.value;


const profundidade =
document
.getElementById("profundidade")
.value;


const resultado =
document
.getElementById("resultado");


const status =
document
.getElementById("status");


resultado
.classList
.remove("hidden");


status.textContent =
"🔎 Pesquisando artigos científicos...";


const ids =
await pesquisar(
tema,
profundidade
);


status.textContent =
"📚 Recuperando artigos e resumos...";


const artigos =
await buscarArtigos(ids);


status.textContent =
"🧠 Preparando roteiro...";


mostrarResultado(
tema,
duracao,
tipo,
artigos
);


status.textContent =
"✅ Roteiro pronto! " +
artigos.length +
" artigo(s) encontrado(s).";

}


/* =========================
   NARRAÇÃO
========================= */

function ouvir(){

if(!synth){

alert(
"Narração não suportada."
);

return;

}


synth.cancel();


const utterance =
new SpeechSynthesisUtterance(
textoNarracao
);


const indice =
parseInt(
document
.getElementById("voz")
.value,
10
);


if(vozes[indice]){

utterance.voice =
vozes[indice];

}


utterance.lang =
"pt-BR";

utterance.rate =
0.95;

utterance.pitch =
1;

utterance.volume =
1;


synth.speak(
utterance
);

}


function pausar(){

if(
synth &&
synth.speaking
){

synth.pause();

}

}


function parar(){

if(synth){

synth.cancel();

}

}


/* =========================
   QUEBRAR TEXTO
========================= */

function quebrarTexto(
ctx,
texto,
largura
){

const palavras =
texto.split(" ");

const linhas = [];

let linha = "";


palavras.forEach(
function(palavra){

const teste =
linha +
palavra +
" ";


if(
ctx.measureText(
teste
).width >
largura
){

if(linha)
linhas.push(
linha
);


linha =
palavra +
" ";

}
else{

linha =
teste;

}

});


if(linha)
linhas.push(
linha
);


return linhas;

}


/* =========================
   DESENHAR CENA
========================= */

function desenharCena(
ctx,
cena,
indice,
progresso,
tema
){

const W = 1080;
const H = 1920;


/* =====================================================
   FUNDO
===================================================== */

const fundo = ctx.createLinearGradient(
0,
0,
W,
H
);

fundo.addColorStop(0,"#061c25");
fundo.addColorStop(0.5,"#0b3b45");
fundo.addColorStop(1,"#06251e");

ctx.fillStyle = fundo;
ctx.fillRect(0,0,W,H);


/* =====================================================
   ANIMAÇÃO GERAL
===================================================== */

const movimento =
progresso * Math.PI * 2;

ctx.textAlign = "center";


/* =====================================================
   PARTÍCULAS
===================================================== */

for(let i=0;i<24;i++){

const x =
((i * 97) +
(progresso * 160 * (i % 3 + 1))) % 1200 - 60;

const y =
150 + ((i * 83) % 1450);

const tamanho =
4 + (i % 4) * 3;

ctx.beginPath();

ctx.arc(
x,
y,
tamanho,
0,
Math.PI * 2
);

ctx.fillStyle =
"rgba(130,245,210,.25)";

ctx.fill();

}


/* =====================================================
   TÍTULO DA CENA
===================================================== */

ctx.font =
"bold 56px Arial";

ctx.fillStyle =
"#ffffff";

ctx.fillText(
cena.titulo,
W/2,
180
);


/* =====================================================
   CENA 1 — INTRODUÇÃO
===================================================== */

if(indice === 0){

/* moléculas flutuando */

for(let i=0;i<9;i++){

const angulo =
(i/9)*Math.PI*2 +
movimento;

const raio = 270;

const x =
W/2 +
Math.cos(angulo)*raio;

const y =
700 +
Math.sin(angulo)*raio;

ctx.beginPath();

ctx.arc(
x,
y,
32,
0,
Math.PI*2
);

ctx.fillStyle =
i%2 === 0 ?
"#72e6bd" :
"#d99ad9";

ctx.fill();

ctx.beginPath();

ctx.moveTo(
W/2,
700
);

ctx.lineTo(
x,
y
);

ctx.strokeStyle =
"rgba(255,255,255,.25)";

ctx.lineWidth = 5;

ctx.stroke();

}

/* núcleo */

ctx.beginPath();

ctx.arc(
W/2,
700,
80,
0,
Math.PI*2
);

ctx.fillStyle =
"#ffffff";

ctx.fill();

ctx.fillStyle =
"#0a5142";

ctx.font =
"bold 34px Arial";

ctx.fillText(
"BIO",
W/2,
712
);

}


/* =====================================================
   CENA 2 — O QUE É?
===================================================== */

if(indice === 1){

/* célula */

const cx = W/2;
const cy = 700;


/* membrana */

ctx.beginPath();

ctx.arc(
cx,
cy,
280,
0,
Math.PI*2
);

const celula =
ctx.createRadialGradient(
cx-80,
cy-100,
20,
cx,
cy,
300
);

celula.addColorStop(
0,
"#a6f4c8"
);

celula.addColorStop(
1,
"#16705b"
);

ctx.fillStyle =
celula;

ctx.fill();

ctx.strokeStyle =
"#d5ffe9";

ctx.lineWidth = 12;

ctx.stroke();


/* núcleo */

ctx.beginPath();

ctx.arc(
cx,
cy,
105,
0,
Math.PI*2
);

ctx.fillStyle =
"#a967c6";

ctx.fill();

ctx.strokeStyle =
"#f2cfff";

ctx.lineWidth = 8;

ctx.stroke();


/* organelas */

for(let i=0;i<12;i++){

const a =
i*Math.PI*2/12 +
movimento;

const x =
cx +
Math.cos(a)*175;

const y =
cy +
Math.sin(a)*175;

ctx.beginPath();

ctx.ellipse(
x,
y,
34,
20,
a,
0,
Math.PI*2
);

ctx.fillStyle =
i%2 === 0 ?
"#ffcf75" :
"#ff9bd7";

ctx.fill();

}

}


/* =====================================================
   CENA 3 — COMO FUNCIONA?
===================================================== */

if(indice === 2){

/* DNA */

const centro = W/2;

for(
let y=400;
y<=1000;
y+=8
){

const fase =
y/70 +
movimento;

const x1 =
centro +
Math.sin(fase)*220;

const x2 =
centro -
Math.sin(fase)*220;


/* fita 1 */

ctx.beginPath();

ctx.arc(
x1,
y,
9,
0,
Math.PI*2
);

ctx.fillStyle =
"#75efc1";

ctx.fill();


/* fita 2 */

ctx.beginPath();

ctx.arc(
x2,
y,
9,
0,
Math.PI*2
);

ctx.fillStyle =
"#e59cda";

ctx.fill();


/* ligação */

if(y % 48 === 0){

ctx.beginPath();

ctx.moveTo(
x1,
y
);

ctx.lineTo(
x2,
y
);

ctx.strokeStyle =
"rgba(255,255,255,.65)";

ctx.lineWidth = 5;

ctx.stroke();

}

}

}


/* =====================================================
   CENA 4 — APLICAÇÕES
===================================================== */

if(indice === 3){

/* laboratório */

ctx.fillStyle =
"rgba(255,255,255,.08)";

ctx.roundRect(
180,
470,
720,
580,
40,
);

ctx.fill();


/* frasco */

ctx.beginPath();

ctx.roundRect(
430,
560,
220,
330,
30
);

ctx.fillStyle =
"#b9f4d1";

/* =========================
   GERADOR DE VÍDEO
========================= */

async function gerarVideoBio(){

const status =
document
.getElementById(
"videoStatus"
);


const video =
document
.getElementById(
"videoPreview"
);


const download =
document
.getElementById(
"downloadVideo"
);


const tema =
document
.getElementById(
"tema"
)
.value
.trim()
||
"Biotecnologia e o cérebro";


const duracao =
parseInt(
document
.getElementById(
"duracao"
)
.value,
10
)
||
1;


/* PRECISA TER ROTEIRO */

if(
!cenasAtuais.length
){

alert(
"Primeiro clique em Criar roteiro."
);

return;

}


/* VERIFICA SUPORTE */

if(
!HTMLCanvasElement
.prototype
.captureStream
||
!window.MediaRecorder
){

status.textContent =
"⚠️ Este navegador não suporta a geração de vídeo.";

return;

}


status.textContent =
"🎬 Preparando vídeo de " +
duracao +
" minuto(s)...";


/* CANVAS */

const canvas =
document
.createElement(
"canvas"
);


canvas.width =
1080;

canvas.height =
1920;


const ctx =
canvas.getContext(
"2d"
);


/* STREAM */

const stream =
canvas.captureStream(
30
);


let tipoVideo =
"video/webm";


if(
MediaRecorder
.isTypeSupported(
"video/webm;codecs=vp9"
)
){

tipoVideo =
"video/webm;codecs=vp9";

}
else if(
MediaRecorder
.isTypeSupported(
"video/webm;codecs=vp8"
)
){

tipoVideo =
"video/webm;codecs=vp8";

}


const partes = [];


const recorder =
new MediaRecorder(
stream,
{
mimeType:
tipoVideo
}
);


recorder
.ondataavailable =
function(event){

if(
event.data.size > 0
){

partes.push(
event.data
);

}

};


const terminou =
new Promise(
function(resolve){

recorder.onstop =
resolve;

});


/* COMEÇA GRAVAÇÃO */

recorder.start(
1000
);


/* DURAÇÃO REAL */

const inicio =
performance.now();


const duracaoTotal =
duracao *
60 *
1000;


/* ANIMAÇÃO */

function quadro(){

const agora =
performance.now();


const decorrido =
agora -
inicio;


const progresso =
Math.min(
decorrido /
duracaoTotal,
1
);


const indice =
Math.min(
Math.floor(
progresso *
cenasAtuais.length
),
cenasAtuais.length - 1
);


const cena =
cenasAtuais[indice];


desenharCena(
ctx,
cena,
indice,
progresso,
tema
);


status.textContent =
"🎥 Gerando cena " +
(indice + 1) +
" de " +
cenasAtuais.length +
" • " +
Math.round(
progresso * 100
) +
"%";


if(
decorrido <
duracaoTotal
){

requestAnimationFrame(
quadro
);

}
else{

recorder.stop();

}

}


quadro();


/* ESPERA TERMINAR */

await terminou;


/* CRIA ARQUIVO */

const blob =
new Blob(
partes,
{
type:
tipoVideo
}
);


const url =
URL.createObjectURL(
blob
);


video.src =
url;


video.style.display =
"block";


download.href =
url;


download.style.display =
"block";


download.download =
"BioVideoAI.webm";


status.textContent =
"✅ Vídeo criado com sucesso!";

}


/* =========================
   BOTÕES
========================= */

document
.getElementById(
"btnRoteiro"
)
.addEventListener(
"click",
criarRoteiro
);


document
.getElementById(
"btnOuvir"
)
.addEventListener(
"click",
ouvir
);


document
.getElementById(
"btnPausar"
)
.addEventListener(
"click",
pausar
);


document
.getElementById(
"btnParar"
)
.addEventListener(
"click",
parar
);


document
.getElementById(
"btnGerarVideo"
)
.addEventListener(
"click",
gerarVideoBio
);

</script>

</body>
