</video>

<script>

"use strict";


/* =========================
   VARIÁVEIS
========================= */

const synth =
window.speechSynthesis;

let vozes = [];

let cenasAtuais = [];

let textoNarracao = "";


/* =========================
   VOZES
========================= */

function carregarVozes(){

if(!synth) return;

vozes =
synth.getVoices();

const select =
document.getElementById("voz");

select.innerHTML = "";

const brasileiras =
vozes.filter(function(v){

return v.lang &&
v.lang.toLowerCase()
.startsWith("pt");

});

const lista =
brasileiras.length ?
brasileiras :
vozes;

lista.forEach(function(v){

const option =
document.createElement("option");

option.value =
vozes.indexOf(v);

option.textContent =
v.name +
" (" +
v.lang +
")";

select.appendChild(option);

});

}

carregarVozes();

if(
synth.onvoiceschanged !== undefined
){

synth.onvoiceschanged =
carregarVozes;

}


/* =========================
   TERMOS
========================= */

const termos = {

"cérebro":"brain",
"cerebro":"brain",

"neurônio":"neuron",
"neuronio":"neuron",

"neurônios":"neurons",
"neuronios":"neurons",

"dna":"DNA",
"rna":"RNA",

"genética":"genetics",
"genetica":"genetics",

"biotecnologia":"biotechnology",

"medicina":"medicine",

"saúde":"health",
"saude":"health",

"doença":"disease",
"doenca":"disease",

"câncer":"cancer",
"cancer":"cancer",

"vacina":"vaccine",
"vacinas":"vaccines",

"agricultura":"agriculture",

"plantas":"plants",

"bactéria":"bacteria",
"bacteria":"bacteria",

"vírus":"virus",
"virus":"virus",

"psicologia":"psychology",

"memória":"memory",
"memoria":"memory",

"comportamento":"behavior"

};


/* =========================
   TERMOS DE PESQUISA
========================= */

function gerarTermos(tema){

const partes =
tema
.toLowerCase()
.replace(/[?!.,;:()]/g,"")
.split(/\s+/);

const ingles = [];

partes.forEach(function(p){

if(termos[p])
ingles.push(termos[p]);

});

const lista = [tema];

if(ingles.length){

lista.push(
ingles.join(" AND ")
);

}

return lista;

}


/* =========================
   PUBMED
========================= */

async function pesquisar(
tema,
profundidade
){

let limite = 5;

if(
profundidade === "completa"
)
limite = 10;

if(
profundidade === "profunda"
)
limite = 15;


const termosPesquisa =
gerarTermos(tema);

const ids = [];

const usados = {};


for(
let i=0;
i<termosPesquisa.length;
i++
){

try{

const url =
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi" +

"?db=pubmed" +

"&term=" +
encodeURIComponent(
termosPesquisa[i]
) +

"&retmax=" +
limite +

"&retmode=json" +

"&sort=relevance" +

"&tool=BioVideoAI";


const resposta =
await fetch(url);

const dados =
await resposta.json();


const encontrados =
dados
.esearchresult
.idlist || [];


encontrados.forEach(function(id){

if(!usados[id]){

usados[id] = true;

ids.push(id);

}

});

}
catch(e){

console.log(e);

}

}


return ids.slice(
0,
limite
);

}


/* =========================
   ARTIGOS
========================= */

async function buscarArtigos(ids){

if(!ids.length)
return [];


try{

const url =
"https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi" +

"?db=pubmed" +

"&id=" +
ids.join(",") +

"&retmode=xml" +

"&tool=BioVideoAI";


const resposta =
await fetch(url);

const xml =
await resposta.text();


const doc =
new DOMParser()
.parseFromString(
xml,
"text/xml"
);


const lista = [];


doc
.querySelectorAll(
"PubmedArticle"
)
.forEach(function(a){

const titulo =
a.querySelector(
"ArticleTitle"
);

const pmid =
a.querySelector(
"PMID"
);


let resumo = "";


a
.querySelectorAll(
"AbstractText"
)
.forEach(function(x){

resumo +=
x.textContent +
" ";

});


lista.push({

titulo:
titulo ?
titulo.textContent :
"Título não disponível",

pmid:
pmid ?
pmid.textContent :
"",

resumo:
resumo.trim(),

link:
pmid ?
"https://pubmed.ncbi.nlm.nih.gov/" +
pmid.textContent +
"/" :
""

});

});


return lista;

}
catch(e){

console.log(e);

return [];

}

}


/* =========================
   TEMPO
========================= */

function formatarTempo(segundos){

return (

Math.floor(
segundos / 60
)

+

":"

+

String(
Math.floor(
segundos % 60
)
)
.padStart(
2,
"0"
)

);

}


/* =========================
   CENAS
========================= */

function criarCenas(
tema,
duracao
){

const total =
duracao * 60;

const parte =
total / 6;


const dados = [

[

"INTRODUÇÃO",

"Imagem ou animação relacionada diretamente ao tema.",

"Você já parou para pensar sobre " +
tema +
"? Neste vídeo vamos entender esse assunto de forma simples e baseada em ciência.",

"Conheça o tema"

],

[

"O QUE É?",

"Mostrar os principais conceitos científicos relacionados ao assunto.",

"Primeiro, vamos entender o que significa " +
tema +
" e quais são os conceitos fundamentais envolvidos.",

"O que é?"

],

[

"COMO FUNCIONA?",

"Animação mostrando o processo de forma didática.",

"Agora vamos entender como esse processo funciona e quais mecanismos científicos estão envolvidos.",

"Como funciona?"

],

[

"APLICAÇÕES",

"Mostrar exemplos de aplicações no mundo real.",

"A pesquisa científica investiga diferentes aplicações e possibilidades relacionadas a esse campo.",

"Aplicações reais"

],

[

"EVIDÊNCIAS CIENTÍFICAS",

"Mostrar laboratório, pesquisadores e artigos científicos.",

"Os estudos científicos ajudam a compreender o que já sabemos, o que ainda está sendo investigado e quais são as limitações das evidências.",

"O que dizem as pesquisas?"

],

[

"CONCLUSÃO",

"Retomar os principais pontos apresentados.",

"Em resumo, " +
tema +
" envolve ciência, tecnologia e diferentes possibilidades. Conhecer as evidências ajuda a compreender o assunto de maneira responsável.",

"Conclusão"

]

];


const cenas = [];


for(
let i=0;
i<6;
i++
){

const inicio =
i * parte;

const fim =
i === 5 ?
total :
(i + 1) * parte;


cenas.push({

titulo:
dados[i][0],

visual:
dados[i][1],

narracao:
dados[i][2],

legenda:
dados[i][3],

inicio:
inicio,

fim:
fim,

tempo:
formatarTempo(inicio) +
" – " +
formatarTempo(fim)

});

}


return cenas;

}


/* =========================
   MOSTRAR ROTEIRO
========================= */

function mostrarResultado(
tema,
duracao,
tipo,
artigos
){

cenasAtuais =
criarCenas(
tema,
duracao
);


textoNarracao = "";


let html =
"<h2>🎬 Roteiro preparado!</h2>";


html +=
"<p><b>Tema:</b> " +
tema +
"</p>";


html +=
"<p><b>Duração:</b> " +
duracao +
" minuto(s)</p>";


html +=
"<p><b>Tipo:</b> " +
tipo +
"</p>";


cenasAtuais.forEach(
function(cena,i){

html +=
'<div class="scene">';


html +=
"<h3>🎬 Cena " +
(i + 1) +
" — " +
cena.titulo +
"</h3>";


html +=
"<p><b>⏱️ Tempo:</b> " +
cena.tempo +
"</p>";


html +=
"<p><b>🖼️ Visual:</b> " +
cena.visual +
"</p>";


html +=
"<p><b>🎙️ Narração:</b> " +
cena.narracao +
"</p>";


html +=
"<p><b>📝 Texto na tela:</b> " +
cena.legenda +
"</p>";


html +=
"</div>";


textoNarracao +=
cena.narracao +
" ";

});


html +=
"<h2>📚 Referências científicas</h2>";


if(!artigos.length){

html +=
"<p>Nenhum artigo encontrado para esse tema.</p>";

}


artigos.forEach(
function(a,i){

html +=
'<div class="reference">';


html +=
"<b>" +
(i + 1) +
". " +
a.titulo +
"</b>";


if(a.pmid){

html +=
"<p class='small'>PMID: " +
a.pmid +
"</p>";

}


if(a.resumo){

html +=
"<p>" +
a.resumo +
"</p>";

}


if(a.link){

html +=
'<a href="' +
a.link +
'" target="_blank">' +
"🔗 Abrir artigo no PubMed" +
"</a>";

}


html +=
"</div>";

});


document
.getElementById(
"roteiro"
)
.innerHTML = html;


document
.getElementById(
"resultado"
)
.classList
.remove("hidden");

}


/* =========================
   CRIAR ROTEIRO
========================= */

async function criarRoteiro(){

const tema =
document
.getElementById("tema")
.value
.trim();


if(!tema){

alert(
"Digite o tema primeiro."
);

return;

}


const duracao =
parseInt(
document
.getElementById("duracao")
.value,
10
);


const tipo =
document
.getElementById("tipo")
.value;


const profundidade =
document
.getElementById("profundidade")
.value;


const resultado =
document
.getElementById("resultado");


const status =
document
.getElementById("status");


resultado
.classList
.remove("hidden");


status.textContent =
"🔎 Pesquisando artigos científicos...";


const ids =
await pesquisar(
tema,
profundidade
);


status.textContent =
"📚 Recuperando artigos e resumos...";


const artigos =
await buscarArtigos(ids);


status.textContent =
"🧠 Preparando roteiro...";


mostrarResultado(
tema,
duracao,
tipo,
artigos
);


status.textContent =
"✅ Roteiro pronto! " +
artigos.length +
" artigo(s) encontrado(s).";

}


/* =========================
   NARRAÇÃO
========================= */

function ouvir(){

if(!synth){

alert(
"Narração não suportada."
);

return;

}


synth.cancel();


const utterance =
new SpeechSynthesisUtterance(
textoNarracao
);


const indice =
parseInt(
document
.getElementById("voz")
.value,
10
);


if(vozes[indice]){

utterance.voice =
vozes[indice];

}


utterance.lang =
"pt-BR";

utterance.rate =
0.95;

utterance.pitch =
1;

utterance.volume =
1;


synth.speak(
utterance
);

}


function pausar(){

if(
synth &&
synth.speaking
){

synth.pause();

}

}


function parar(){

if(synth){

synth.cancel();

}

}


/* =========================
   QUEBRAR TEXTO
========================= */

function quebrarTexto(
ctx,
texto,
largura
){

const palavras =
texto.split(" ");

const linhas = [];

let linha = "";


palavras.forEach(
function(palavra){

const teste =
linha +
palavra +
" ";


if(
ctx.measureText(
teste
).width >
largura
){

if(linha)
linhas.push(
linha
);


linha =
palavra +
" ";

}
else{

linha =
teste;

}

});


if(linha)
linhas.push(
linha
);


return linhas;

}


/* =========================
   DESENHAR CENA
========================= */
function desenharCena(ctx, cena, indice, progresso, tema){

const W = 1080;
const H = 1920;

ctx.clearRect(0,0,W,H);

/* =========================
   FUNDO
========================= */

const fundo = ctx.createLinearGradient(0,0,W,H);

fundo.addColorStop(0,"#071c18");
fundo.addColorStop(.45,"#103f34");
fundo.addColorStop(1,"#061510");

ctx.fillStyle = fundo;
ctx.fillRect(0,0,W,H);


/* =========================
   MOVIMENTO DE FUNDO
========================= */

for(let i=0;i<28;i++){

const x =
((i*173)+(progresso*180)) % 1150 - 35;

const y =
180 +
((i*97)%1450);

const r =
5 + (i%5);

ctx.beginPath();

ctx.arc(
x,
y,
r,
0,
Math.PI*2
);

ctx.fillStyle =
"rgba(120,255,205,.15)";

ctx.fill();

}


/* =========================
   TIPO DE ILUSTRAÇÃO
========================= */

const t =
tema.toLowerCase();


/* =========================
   CÉREBRO
========================= */

if(
t.includes("cérebro") ||
t.includes("cerebro") ||
t.includes("neur")
){

const cx = 540;
const cy = 670;


/* cérebro */

ctx.save();

ctx.translate(cx,cy);

ctx.scale(
1 + Math.sin(progresso*Math.PI*2)*.025,
1 + Math.sin(progresso*Math.PI*2)*.025
);

ctx.beginPath();

ctx.moveTo(-210,20);

ctx.bezierCurveTo(
-270,-100,
-210,-250,
-70,-270
);

ctx.bezierCurveTo(
20,-350,
180,-290,
210,-170
);

ctx.bezierCurveTo(
280,-60,
240,120,
130,180
);

ctx.bezierCurveTo(
30,260,
-120,230,
-210,20
);

ctx.closePath();

const cerebro =
ctx.createRadialGradient(
0,-50,
20,
0,0,
300
);

cerebro.addColorStop(
0,
"#ff9bd2"
);

cerebro.addColorStop(
1,
"#a94c9c"
);

ctx.fillStyle = cerebro;
ctx.fill();

ctx.strokeStyle =
"#ffd0ee";

ctx.lineWidth = 9;

ctx.stroke();


/* sulcos */

ctx.strokeStyle =
"rgba(255,230,250,.65)";

ctx.lineWidth = 7;

for(let i=-2;i<=2;i++){

ctx.beginPath();

ctx.moveTo(
-150,
i*55
);

ctx.bezierCurveTo(
-60,
i*55-50,
-50,
i*55+60,
20,
i*55
);

ctx.bezierCurveTo(
80,
i*55-50,
130,
i*55+50,
170,
i*55-10
);

ctx.stroke();

}

ctx.restore();


/* neurônios */

for(let i=0;i<7;i++){

const ang =
i*Math.PI*2/7 +
progresso*Math.PI*2;

const x =
540 +
Math.cos(ang)*360;

const y =
670 +
Math.sin(ang)*300;

ctx.beginPath();

ctx.arc(
x,
y,
18,
0,
Math.PI*2
);

ctx.fillStyle =
"#8df5d0";

ctx.fill();


ctx.beginPath();

ctx.moveTo(
x,
y
);

ctx.lineTo(
540 +
Math.cos(ang)*200,
670 +
Math.sin(ang)*160
);

ctx.strokeStyle =
"rgba(141,245,208,.35)";

ctx.lineWidth = 5;

ctx.stroke();

}

}


/* =========================
   DNA
========================= */

else if(
t.includes("dna") ||
t.includes("genét") ||
t.includes("genet")
){

const centro = 540;

ctx.lineWidth = 8;

for(
let y=350;
y<1000;
y+=7
){

const fase =
y/70 +
progresso*Math.PI*4;

const x1 =
centro +
Math.sin(fase)*190;

const x2 =
centro -
Math.sin(fase)*190;


ctx.beginPath();

ctx.arc(
x1,
y,
7,
0,
Math.PI*2
);

ctx.fillStyle =
"#73f0bd";

ctx.fill();


ctx.beginPath();

ctx.arc(
x2,
y,
7,
0,
Math.PI*2
);

ctx.fillStyle =
"#ff9bd2";

ctx.fill();


if(y%42===0){

ctx.beginPath();

ctx.moveTo(
x1,
y
);

ctx.lineTo(
x2,
y
);

ctx.strokeStyle =
"rgba(255,255,255,.55)";

ctx.stroke();

}

}

}


/* =========================
   CÉLULA
========================= */

else if(
t.includes("célula") ||
t.includes("celula") ||
t.includes("bactéria") ||
t.includes("bacteria")
){

const cx = 540;
const cy = 670;


/* membrana */

ctx.beginPath();

ctx.arc(
cx,
cy,
270,
0,
Math.PI*2
);

const celula =
ctx.createRadialGradient(
cx-70,
cy-80,
30,
cx,
cy,
300
);

celula.addColorStop(
0,
"#72e8b2"
);

celula.addColorStop(
1,
"#176c54"
);

ctx.fillStyle = celula;
ctx.fill();

ctx.strokeStyle =
"#b9ffe0";

ctx.lineWidth = 9;

ctx.stroke();


/* núcleo */

ctx.beginPath();

ctx.arc(
cx,
cy,
100,
0,
Math.PI*2
);

ctx.fillStyle =
"#b36ed2";

ctx.fill();

ctx.strokeStyle =
"#f0caff";

ctx.lineWidth = 7;

ctx.stroke();


/* organelas */

for(let i=0;i<12;i++){

const a =
i*Math.PI*2/12 +
progresso;

const x =
cx +
Math.cos(a)*170;

const y =
cy +
Math.sin(a)*170;

ctx.beginPath();

ctx.ellipse(
x,
y,
25,
14,
a,
0,
Math.PI*2
);

ctx.fillStyle =
"#ffd47a";

ctx.fill();

}

}


/* =========================
   BIOTECNOLOGIA
========================= */

else{

/* molécula */

const cx = 540;
const cy = 650;

for(let i=0;i<8;i++){

const a =
i*Math.PI*2/8 +
progresso*Math.PI*2;

const x =
cx +
Math.cos(a)*250;

const y =
cy +
Math.sin(a)*250;

ctx.beginPath();

ctx.arc(
x,
y,
35,
0,
Math.PI*2
);

ctx.fillStyle =
i%2===0 ?
"#74edbd" :
"#d78bea";

ctx.fill();


ctx.beginPath();

ctx.moveTo(
cx,
cy
);

ctx.lineTo(
x,
y
);

ctx.strokeStyle =
"rgba(255,255,255,.35)";

ctx.lineWidth = 5;

ctx.stroke();

}


ctx.beginPath();

ctx.arc(
cx,
cy,
80,
0,
Math.PI*2
);

ctx.fillStyle =
"#fff";

ctx.fill();


ctx.font =
"bold 55px Arial";

ctx.fillStyle =
"#164d3b";

ctx.textAlign =
"center";

ctx.fillText(
"BIO",
cx,
cy+20
);

}


/* =========================
   TÍTULO DA CENA
========================= */

ctx.textAlign =
"center";

ctx.font =
"bold 64px Arial";

ctx.fillStyle =
"#ffffff";

ctx.fillText(
cena.titulo,
540,
1120
);


/* linha */

ctx.fillStyle =
"#7ff2c0";

ctx.fillRect(
390,
1170,
300,
7
);


/* =========================
   LEGENDA
========================= */

ctx.font =
"38px Arial";

ctx.fillStyle =
"#ffffff";

const linhas =
quebrarTexto(
ctx,
cena.legenda,
820
);

linhas
.slice(0,4)
.forEach(
function(linha,i){

ctx.fillText(
linha,
540,
1280+i*65
);

});


/* =========================
   NOME DO PROJETO
========================= */

ctx.font =
"28px Arial";

ctx.fillStyle =
"rgba(255,255,255,.65)";

ctx.fillText(
"BioVideo AI • Vídeo educativo",
540,
1690
);


/* =========================
   PROGRESSO
========================= */

ctx.fillStyle =
"rgba(255,255,255,.2)";

ctx.fillRect(
100,
1780,
880,
10
);

ctx.fillStyle =
"#7ff2c0";

ctx.fillRect(
100,
1780,
880*progresso,
10
);

}

/* =========================
   GERADOR DE VÍDEO
========================= */

async function gerarVideoBio(){

const status =
document
.getElementById(
"videoStatus"
);


const video =
document
.getElementById(
"videoPreview"
);


const download =
document
.getElementById(
"downloadVideo"
);


const tema =
document
.getElementById(
"tema"
)
.value
.trim()
||
"Biotecnologia e o cérebro";


const duracao =
parseInt(
document
.getElementById(
"duracao"
)
.value,
10
)
||
1;


/* PRECISA TER ROTEIRO */

if(
!cenasAtuais.length
){

alert(
"Primeiro clique em Criar roteiro."
);

return;

}


/* VERIFICA SUPORTE */

if(
!HTMLCanvasElement
.prototype
.captureStream
||
!window.MediaRecorder
){

status.textContent =
"⚠️ Este navegador não suporta a geração de vídeo.";

return;

}


status.textContent =
"🎬 Preparando vídeo de " +
duracao +
" minuto(s)...";


/* CANVAS */

const canvas =
document
.createElement(
"canvas"
);


canvas.width =
1080;

canvas.height =
1920;


const ctx =
canvas.getContext(
"2d"
);


/* STREAM */

const stream =
canvas.captureStream(
30
);


let tipoVideo =
"video/webm";


if(
MediaRecorder
.isTypeSupported(
"video/webm;codecs=vp9"
)
){

tipoVideo =
"video/webm;codecs=vp9";

}
else if(
MediaRecorder
.isTypeSupported(
"video/webm;codecs=vp8"
)
){

tipoVideo =
"video/webm;codecs=vp8";

}


const partes = [];


const recorder =
new MediaRecorder(
stream,
{
mimeType:
tipoVideo
}
);


recorder
.ondataavailable =
function(event){

if(
event.data.size > 0
){

partes.push(
event.data
);

}

};


const terminou =
new Promise(
function(resolve){

recorder.onstop =
resolve;

});


/* COMEÇA GRAVAÇÃO */

recorder.start(
1000
);


/* DURAÇÃO REAL */

const inicio =
performance.now();


const duracaoTotal =
duracao *
60 *
1000;


/* ANIMAÇÃO */

function quadro(){

const agora =
performance.now();


const decorrido =
agora -
inicio;


const progresso =
Math.min(
decorrido /
duracaoTotal,
1
);


const indice =
Math.min(
Math.floor(
progresso *
cenasAtuais.length
),
cenasAtuais.length - 1
);


const cena =
cenasAtuais[indice];


desenharCena(
ctx,
cena,
indice,
progresso,
tema
);


status.textContent =
"🎥 Gerando cena " +
(indice + 1) +
" de " +
cenasAtuais.length +
" • " +
Math.round(
progresso * 100
) +
"%";


if(
decorrido <
duracaoTotal
){

requestAnimationFrame(
quadro
);

}
else{

recorder.stop();

}

}


quadro();


/* ESPERA TERMINAR */

await terminou;


/* CRIA ARQUIVO */

const blob =
new Blob(
partes,
{
type:
tipoVideo
}
);


const url =
URL.createObjectURL(
blob
);


video.src =
url;


video.style.display =
"block";


download.href =
url;


download.style.display =
"block";


download.download =
"BioVideoAI.webm";


status.textContent =
"✅ Vídeo criado com sucesso!";

}


/* =========================
   BOTÕES
========================= */

document
.getElementById(
"btnRoteiro"
)
.addEventListener(
"click",
criarRoteiro
);


document
.getElementById(
"btnOuvir"
)
.addEventListener(
"click",
ouvir
);


document
.getElementById(
"btnPausar"
)
.addEventListener(
"click",
pausar
);


document
.getElementById(
"btnParar"
)
.addEventListener(
"click",
parar
);


document
.getElementById(
"btnGerarVideo"
)
.addEventListener(
"click",
gerarVideoBio
);

</script>

</body>
</html>
